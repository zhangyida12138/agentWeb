[project]
name = "agent-web-shared"
version = "0.1.0"
description = "AgentWeb 后端公共包：跨应用/限界上下文复用的无状态工具函数"
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_web_shared"]

[tool.ruff]
line-length = 100
indent-width = 4
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "RUF"]
ignore = [
    # 中文 docstring 中的全角标点（：，（））是有意为之，不视为 ambiguous
    "RUF002",
    # 中文注释中的全角标点（：，（））是有意为之，不视为 ambiguous
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["agent_web_shared"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
docstring-code-format = true
